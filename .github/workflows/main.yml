name: Build DockMFD
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86            # Orbiter 2016 is a 32-bit program
      - name: Compile plugin
        shell: cmd
        run: |
          if not exist Modules\Plugin mkdir Modules\Plugin
          cl /nologo /LD /MD /O2 /EHsc /std:c++14 /I"sdk\include" Source\DockMFD.cpp Source\DockMath.cpp /link /LIBPATH:"sdk\lib" orbiter.lib Orbitersdk.lib user32.lib gdi32.lib /OUT:Modules\Plugin\DockMFD.dll
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: DockMFD-install
          path: Modules
